postgres:
  host: REPLACE_WITH_PGHOST
  port: REPLACE_WITH_PGPORT    # usually 5432
  database: REPLACE_WITH_PGDATABASE
  username: REPLACE_WITH_PGUSER
  password: REPLACE_WITH_PGPASSWORD
  sslmode: disable             # Use 'require' for SSL if supported
smtpServer:
  host: ""      # we will fill this later for SMTP
  port: 587
  username: ""
  password: ""
  encryption: tls   # tls for port 587 (STARTTLS), or ssl for 465
idp:
  github:
    disable: false
    key: ""
    secret: ""
  gitlab:
    disable: false
    key: ""
    secret: ""
  google:
    disable: false
    key: ""
    secret: ""
  facebook:
    disable: true    # disable providers you won't use
    key: ""
    secret: ""
  twitter:
    disable: true
    key: ""
    secret: ""
xsrfSecret: ""   # will generate a random one if left empty
